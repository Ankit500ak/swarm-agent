<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="swarm-agent - your code never leaves your network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0c"/>
      <stop offset="1" stop-color="#101812"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="13" fill="none" stroke="#1e3a24" stroke-width="3"/>

  <!-- peer network motif -->
  <g stroke="#2f6b3c" stroke-width="2" opacity="0.85">
    <line x1="905" y1="90" x2="1010" y2="60"/>
    <line x1="905" y1="90" x2="1000" y2="150"/>
    <line x1="905" y1="90" x2="1085" y2="105"/>
    <line x1="1000" y1="150" x2="1085" y2="105"/>
    <line x1="1000" y1="150" x2="1105" y2="185"/>
    <line x1="1010" y1="60" x2="1085" y2="105"/>
  </g>
  <g>
    <circle cx="905" cy="90" r="17" fill="#0b0f0c" stroke="#4ade80" stroke-width="3"/>
    <circle cx="1010" cy="60" r="11" fill="#0b0f0c" stroke="#4ade80" stroke-width="2.5"/>
    <circle cx="1000" cy="150" r="13" fill="#0b0f0c" stroke="#4ade80" stroke-width="2.5"/>
    <circle cx="1085" cy="105" r="10" fill="#0b0f0c" stroke="#4ade80" stroke-width="2.5"/>
    <circle cx="1105" cy="185" r="9" fill="#0b0f0c" stroke="#4ade80" stroke-width="2.5"/>
    <circle cx="905" cy="90" r="5" fill="#4ade80"/>
    <circle cx="1010" cy="60" r="4" fill="#4ade80"/>
    <circle cx="1000" cy="150" r="4.5" fill="#4ade80"/>
    <circle cx="1085" cy="105" r="3.5" fill="#4ade80"/>
    <circle cx="1105" cy="185" r="3" fill="#4ade80"/>
  </g>
  <text x="905" y="245" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#5b7a63" text-anchor="middle">one cli · many machines</text>

  <!-- wordmark -->
  <text x="64" y="86" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="25" fill="#4ade80">$ cat error.log | swarm-agent fix</text>
  <text x="60" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="82" font-weight="bold" letter-spacing="2" fill="#e8f5e9">SWARM-AGENT</text>
  <text x="64" y="216" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="27" fill="#9fb8a6">Your code never leaves your network.</text>
  <text x="64" y="258" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#5b7a63">a terminal-native coding agent, distributed across your local ollama swarm</text>
</svg>
