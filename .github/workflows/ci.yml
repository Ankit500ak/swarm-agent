# CI — run the pytest suite on every push and pull request.
#
# The project is stdlib-only at runtime, so the only thing to install
# is pytest itself. Python 3.12 matches the version the suite is
# developed against; requires-python is >=3.10 (see pyproject.toml).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest -q
